# Astra S 전용 파라미터. ros_astra_camera(ros2-development)의
# astra_mini_params.yaml을 기반으로 Astra S에 맞게 조정.
#
# Astra S의 컬러 스트림은 cv2/UVC로 열리지 않고 OpenNI2를 통해서만 받을 수
# 있음 (orbbec_color_camera.py에서 실측 확인) -> uvc_camera.enable은 반드시
# false, enable_color:true로 OpenNI2 컬러 스트림 사용.
camera_name: "camera"
color_width: 640
color_height: 480
color_fps: 30
enable_color: true

ir_width: 640
ir_height: 480
ir_fps: 30
enable_ir: true

depth_width: 640
depth_height: 480
depth_fps: 30
enable_depth: true

# depth-to-color 하드웨어 정합. astra_s_depth_hub.py가 쓰던
# IMAGE_REGISTRATION_DEPTH_TO_COLOR와 동일한 목적.
depth_align: true

serial_number: ""
number_of_devices: 1

uvc_camera.enable: false
uvc_camera.format: "mjpeg"
uvc_camera.vid: 0x0
uvc_camera.pid: 0x0
uvc_camera.retry_count: 100

color_roi.x: -1
color_roi.y: -1
color_roi.width: -1
color_roi.height: -1
depth_roi.x: -1
depth_roi.y: -1
depth_roi.width: -1
depth_roi.height: -1

depth_scale: 1
publish_tf: true
tf_publish_rate: 10.0
reconnect_timeout: 6.0
